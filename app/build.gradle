plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id "org.jetbrains.kotlin.kapt"
}

// ---------- release 签名 ----------
// 血泪史：4.3.3~4.3.6 的 release 一律用 signingConfigs.debug，而 GitHub Actions 每
// 次都是全新 runner，AGP 发现没有 ~/.android/debug.keystore 就现场新造一把——于是四个
// 版本四个签名，用户每次升级都必须先卸载，规则数据跟着一起没。
// 现在统一使用一把固定密钥，来源优先级：
//   1. 环境变量（CI：由 Actions Secrets 注入）
//   2. local.properties（本机：signing.storeFile / storePassword / keyAlias / keyPassword）
// 私钥绝不进仓库：*.jks 已在 .gitignore 里，CI 侧走 Secrets，本机侧需要你自己保管好
// godviewer-release.jks。拿不到时不可能凭空签出一致的包，显式回落 debug 并告警，
// 而不是静默产出一个又一次卸不掉的 APK。
def signingProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { signingProps.load(it) }
}
def pickSigningValue = { String envName, String propName ->
    def value = System.getenv(envName)
    (value != null && value.trim().length() > 0) ? value : signingProps.getProperty(propName)
}
def signingStorePath = pickSigningValue("GODVIEWER_KEYSTORE", "signing.storeFile")
def signingStorePassword = pickSigningValue("GODVIEWER_KEYSTORE_PASSWORD", "signing.storePassword")
def signingKeyAlias = pickSigningValue("GODVIEWER_KEY_ALIAS", "signing.keyAlias")
def signingKeyPassword = pickSigningValue("GODVIEWER_KEY_PASSWORD", "signing.keyPassword")
def signingStoreFileRef = (signingStorePath != null) ? file(signingStorePath) : file("${projectDir}/godviewer-release.jks")
def canSignRelease = signingStoreFileRef.exists() &&
        signingStorePassword != null && signingKeyAlias != null && signingKeyPassword != null

// ---------- 版本 ----------
// release：固定下面两个常量（发版时手动改）
// debug：每次 assemble/install/bundle Debug 自动 +1，APK 与 BuildConfig 均为纯数字
// release 基线高于 CI 产出的 debug 号（debug = 基线 + 1），保证 release 能覆盖安装
def RELEASE_VERSION_CODE = 24
def RELEASE_VERSION_NAME = "4.3.6"

def debugVersionFile = file("${projectDir}/debug-version.properties")
def storedDebugCode = RELEASE_VERSION_CODE
if (debugVersionFile.exists()) {
    def props = new Properties()
    debugVersionFile.withInputStream { props.load(it) }
    storedDebugCode = (props.getProperty("VERSION_CODE", String.valueOf(RELEASE_VERSION_CODE)) as Integer)
}
// 至少不低于 release 基线，避免装不上更高 debug
storedDebugCode = Math.max(storedDebugCode, RELEASE_VERSION_CODE)

def isDebugBuildRequest = gradle.startParameter.taskNames.any { name ->
    def n = name.toLowerCase()
    n.contains("assembledebug") || n.contains("installdebug") || n.contains("bundledebug")
}

def debugVersionCode = storedDebugCode
if (isDebugBuildRequest) {
    debugVersionCode = storedDebugCode + 1
    def props = new Properties()
    props.setProperty("VERSION_CODE", String.valueOf(debugVersionCode))
    debugVersionFile.parentFile.mkdirs()
    debugVersionFile.withOutputStream {
        props.store(it, "Auto-incremented on each debug build. Release uses RELEASE_* in build.gradle.")
    }
    println("[GodViewer] debug version -> ${debugVersionCode}")
}

android {
    namespace 'com.godviewer.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.godviewer.app"
        minSdk 23
        targetSdk 35
        // 默认 = release 基线；debug 在 buildTypes + outputs 覆盖
        versionCode RELEASE_VERSION_CODE
        versionName RELEASE_VERSION_NAME

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (canSignRelease) {
                storeFile signingStoreFileRef
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            if (canSignRelease) {
                // 固定密钥：CI 与本机构建、跨版本都签出同一把钥匙，可以直接覆盖安装
                signingConfig signingConfigs.release
            } else {
                // 没配密钥时宁可构建成功也要喊出来，免得又发行一个要卸载的版本
                signingConfig signingConfigs.debug
                println("[GodViewer] WARN: no fixed release keystore configured -> this APK cannot be installed over a published release")
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField("String", "PACKAGE_NAME", "\"com.godviewer.app\"")
            // AGP 8 不再自动生成这两个字段，而 SettingsFragment / UpdateChecker /
            // GodViewerModule 等都会读，release 变体必须显式提供
            buildConfigField("int", "VERSION_CODE", String.valueOf(RELEASE_VERSION_CODE))
            buildConfigField("String", "VERSION_NAME", "\"${RELEASE_VERSION_NAME}\"")
        }
        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
            // 首页/设置页读 BuildConfig，须与 APK 递增号一致
            buildConfigField("int", "VERSION_CODE", String.valueOf(debugVersionCode))
            buildConfigField("String", "VERSION_NAME", "\"${debugVersionCode}\"")
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField("String", "PACKAGE_NAME", "\"com.godviewer.app\"")
        }
    }

    applicationVariants.all { variant ->
        if (variant.buildType.name == "debug") {
            variant.outputs.all { output ->
                output.versionCodeOverride = debugVersionCode
                output.versionNameOverride = String.valueOf(debugVersionCode)
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    // META-INF/xposed 元数据必须完整进 APK（java_init.list / module.prop / scope.list）
    packagingOptions {
        resources {
            merges += 'META-INF/xposed/*'
        }
    }
}

// libxposed/service(101) 的 AAR 元数据要求 compileSdk 36，本机只有 platform 35；
// 库仅使用 Android 16(API 36) 前就存在的稳定 API，目标设备 Android 16 运行时满足，跳过该检查
tasks.matching { it.name.contains('AarMetadata') }.configureEach {
    enabled = false
}

dependencies {
    // libxposed API 102：框架运行时提供，绝不打进 APK（compileOnly）
    compileOnly("io.github.libxposed:api:102.0.0")
    // libxposed/service：宿主 App 侧与 LSPosed 管理器通信（激活状态直读），需打进 APK。
    // 用 101.0.0：102.0.0 要求 compileSdk 37（本机只有 platform 35）；所需 API 两者一致。
    // 库本体是纯 Java，排除其传递的 kotlin-stdlib 2.2（与项目 Kotlin 1.9.24 编译器冲突）
    implementation("io.github.libxposed:service:101.0.0") {
        exclude group: 'org.jetbrains.kotlin'
    }
    implementation 'com.github.bumptech.glide:glide:4.13.1'
    kapt 'com.github.bumptech.glide:compiler:4.13.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}
