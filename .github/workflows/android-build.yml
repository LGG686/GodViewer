name: Android Build

on:
  push:
    # main publishes; feature/* branches only build, so test work never
    # reaches the Releases page.
    branches: [main, 'feature/**']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release with the release APK'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android SDK components
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          CMDT="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$CMDT" ]; then
            yes | "$CMDT" --licenses >/dev/null 2>&1 || true
            "$CMDT" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          fi

      # Release only: R8 + shrinkResources, versionName/code from RELEASE_* in
      # build.gradle. A debug build is never published, so skip it to keep the
      # run short.
      # Signed with the runner's debug keystore (see buildTypes.release in app/build.gradle).
      # Release APKs must share one signature or Android refuses to upgrade in
      # place and the user has to uninstall (which wipes their rules). Every CI
      # run starts from a clean runner, so signingConfigs.debug is a *random*
      # key -- that is exactly how 4.3.3..4.3.6 ended up with four different
      # signatures. Restore the real keystore from Secrets instead; it never
      # lives in the repository.
      # NOTE: `secrets` is not available in `if:` expressions -- trying to gate a
      # step on a secret directly makes GitHub reject the whole workflow file
      # (no job even starts). Flush a flag into the job env instead.
      - name: Restore release signing key
        run: |
          set -euo pipefail
          KEY="${{ secrets.GODVIEWER_KEYSTORE_BASE64 }}"
          if [ -z "$KEY" ]; then
            echo "::warning::No GODVIEWER_KEYSTORE_BASE64 secret -> falling back to the runner's throwaway debug key. This APK will NOT install over a published release."
            echo "HAS_RELEASE_KEY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEY" | base64 -d > "$HOME/godviewer-release.jks"
          {
            echo "GODVIEWER_KEYSTORE=$HOME/godviewer-release.jks"
            echo "GODVIEWER_KEYSTORE_PASSWORD=${{ secrets.GODVIEWER_KEYSTORE_PASSWORD }}"
            echo "GODVIEWER_KEY_ALIAS=${{ secrets.GODVIEWER_KEY_ALIAS }}"
            echo "GODVIEWER_KEY_PASSWORD=${{ secrets.GODVIEWER_KEY_PASSWORD }}"
            echo "HAS_RELEASE_KEY=true"
          } >> "$GITHUB_ENV"
          echo "Release keystore restored."

      - name: Build release APK
        id: build_release
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build-release.log
          echo "BUILD_RELEASE_RC=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Summarize
        if: always()
        run: |
          {
            echo "# CI build report"
            echo
            echo "- commit: \`$(git rev-parse HEAD)\`"
            echo "- subject: $(git log -1 --pretty=%s)"
            echo "- release: **${{ steps.build_release.outcome }}**"
            echo "- finished: $(date -u '+%Y-%m-%d %H:%M:%SZ')"
            echo
            echo "## Errors / warnings"
            echo '```'
            cat build-release.log 2>/dev/null \
              | grep -nE '^(e: |w: )|error:|FAILURE:|What went wrong|Caused by|Could not|Unresolved reference' \
              | head -60 || echo '(none)'
            echo '```'
            echo
            echo "## Tail (release)"
            echo '```'
            tail -40 build-release.log 2>/dev/null || echo '(no release log)'
            echo '```'
          } > ci-report.md
          cat ci-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Print APK signature
        if: steps.build_release.outcome == 'success'
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | head -1)
          if [ -n "$APKSIGNER" ]; then
            {
              echo "### APK signature"
              echo '```'
              "$APKSIGNER" verify --print-certs "$APK" | grep -E "certificate (DN|SHA-1|SHA-256)" || echo "(no signature info)"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Last line of defence. Even with the keystore restored, refuse to let the
      # run go green if the APK does not carry the expected certificate. This is
      # exactly the check that would have caught the 4.3.3..4.3.6 mess on the
      # very first run: four builds, four random signatures, four forced
      # uninstalls. The fingerprint is public information (it ships in every
      # release notes) so hardcoding it here leaks nothing.
      - name: Assert release signature
        if: steps.build_release.outcome == 'success' && env.HAS_RELEASE_KEY == 'true'
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | head -1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" \
                             -type f -name apksigner 2>/dev/null | head -1)
          fi
          # apksigner prints "Signer #1 certificate SHA-1 digest: <hex>" with NO
          # colons, so the expected value is written the same way.
          EXPECTED="3D38FB6237EE0E96E0C0679BD80640771F4AA5BD"
          # apksigner prints "Signer #1 certificate SHA-1 digest: <lowercase
          # fingerprint>"; $NF is the fingerprint, compared uppercased.
          set +e
          RAW=$("$APKSIGNER" verify --print-certs "$APK" 2>&1)
          FP=$(printf '%s\n' "$RAW" | grep -m1 "SHA-1" | awk '{print $NF}' | tr 'a-z' 'A-Z')
          VERIFY_RC=$?
          set -e
          EXPECTED_UPPER=$(echo "$EXPECTED" | tr 'a-z' 'A-Z')
          {
            echo "### Release signature check"
            echo '```'
            echo "expected: $EXPECTED"
            echo "actual:   $FP"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$FP" != "$EXPECTED_UPPER" ]; then
            # The annotation is the only channel readable without log access:
            # ::error:: messages surface through the Checks API.
            echo "::error title=Release signature mismatch::apksigner=[$APKSIGNER] apk=[$APK] expected=[$EXPECTED_UPPER] actual=[$FP] raw=[$(printf '%s' "$RAW" | head -3 | tr '\n' '|')]"
            exit 1
          fi
          echo "Signature matches the GodViewer release key."

      - name: Upload release APK artifact
        if: steps.build_release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: godviewer-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # Release notes used to be hardcoded here, which meant bumping the version
      # in app/build.gradle silently republished the *previous* version's notes
      # under the new title. They now live in docs/changelog-<version>.md, so the
      # missing-file check fails the run instead. Only boilerplate that never
      # changes stays here; this step runs on feature branches too, so a broken
      # changelog shows up before anything reaches the Releases page.
      - name: Prepare release notes
        id: notes
        if: steps.build_release.outcome == 'success'
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 'RELEASE_VERSION_NAME' app/build.gradle \
            | sed -E 's/.*"(.*)".*/\1/')
          CODE=$(grep -m1 'RELEASE_VERSION_CODE' app/build.gradle \
            | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          CHANGELOG="docs/changelog-$VERSION.md"
          if [ ! -f "$CHANGELOG" ]; then
            echo "::error title=Missing changelog::$CHANGELOG not found -- add it in the same commit that bumps RELEASE_VERSION_NAME, otherwise the release ships empty notes."
            exit 1
          fi
          mkdir -p dist
          {
            echo "## GodViewer v$VERSION"
            echo
            cat "$CHANGELOG"
            echo
            echo "### 安装说明"
            echo "- 本包由 CI 自动构建（R8 混淆 + 资源瘦身）"
            echo "- 安装后在 LSPosed 中勾选目标应用作用域，并强制停止一次目标应用"
            echo
            echo "**构建版本**：main 分支 \`${{ github.sha }}\`（versionCode $CODE）"
          } > dist/notes.md
          {
            echo "GODVIEWER_VERSION=$VERSION"
            echo "GODVIEWER_VERSION_CODE=$CODE"
          } >> "$GITHUB_ENV"
          echo "tag=v$VERSION versionCode=$CODE changelog=$CHANGELOG" | tee -a "$GITHUB_STEP_SUMMARY"

      # Publishes the release APK on the Releases page, in the same shape as
      # upstream (Chinese notes, release asset only). Needs "Read and write
      # permissions" under
      # Settings → Actions → General → Workflow permissions.
      #
      # Test builds: a manual run ("Run workflow") only builds by default, so
      # work-in-progress branches never touch the Releases page. Tick the
      # "publish" input to release a manual run, or just push to main.
      # Refuse to publish without the fixed keystore: an APK signed by the
      # runner's throwaway debug key installs only after an uninstall, which is
      # exactly the 4.3.3..4.3.6 mess we just cleaned up on the Releases page.
      # A manual run can still force it via the "publish" checkbox.
      - name: Publish GitHub Release
        if: steps.build_release.outcome == 'success' && steps.notes.outcome == 'success' && ((github.ref == 'refs/heads/main' && env.HAS_RELEASE_KEY == 'true') || inputs.publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$GODVIEWER_VERSION"
          CODE="$GODVIEWER_VERSION_CODE"
          TAG="v$VERSION"
          echo "tag=$TAG versionCode=$CODE" | tee -a "$GITHUB_STEP_SUMMARY"

          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
            "dist/GodViewer-$VERSION-release.apk"

          # Never touch an existing release unless the notes for this exact
          # version are known-good: `gh release delete` below removes it first,
          # so anything that fails afterwards loses the published asset.
          if [ -z "${VERSION:-}" ] || [ -z "${CODE:-}" ]; then
            echo "::error title=Missing version::Version metadata did not carry over from the 'Prepare release notes' step -- refusing to touch the existing release."
            exit 1
          fi

          # Re-publishing the same version replaces the previous release, so a
          # push to main always refreshes the asset instead of failing on a
          # duplicate tag.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "GodViewer v$VERSION" \
            --notes-file dist/notes.md \
            dist/*.apk

          echo "release: https://github.com/${{ github.repository }}/releases/tag/$TAG" \
            >> "$GITHUB_STEP_SUMMARY"
