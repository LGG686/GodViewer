name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android SDK components
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          CMDT="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$CMDT" ]; then
            yes | "$CMDT" --licenses >/dev/null 2>&1 || true
            "$CMDT" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          fi

      - name: Build debug APK
        id: build_debug
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build-debug.log
          echo "BUILD_DEBUG_RC=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      # Release: R8 + shrinkResources, versionName/code from RELEASE_* in build.gradle.
      # Signed with the runner's debug keystore (see buildTypes.release in app/build.gradle).
      - name: Build release APK
        id: build_release
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build-release.log
          echo "BUILD_RELEASE_RC=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Summarize
        if: always()
        run: |
          {
            echo "# CI build report"
            echo
            echo "- commit: \`$(git rev-parse HEAD)\`"
            echo "- subject: $(git log -1 --pretty=%s)"
            echo "- debug: **${{ steps.build_debug.outcome }}**"
            echo "- release: **${{ steps.build_release.outcome }}**"
            echo "- finished: $(date -u '+%Y-%m-%d %H:%M:%SZ')"
            echo
            echo "## Errors / warnings"
            echo '```'
            cat build-debug.log build-release.log 2>/dev/null \
              | grep -nE '^(e: |w: )|error:|FAILURE:|What went wrong|Caused by|Could not|Unresolved reference' \
              | head -60 || echo '(none)'
            echo '```'
            echo
            echo "## Tail (release)"
            echo '```'
            tail -40 build-release.log 2>/dev/null || echo '(no release log)'
            echo '```'
          } > ci-report.md
          cat ci-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK artifact
        if: steps.build_debug.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: godviewer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APK artifact
        if: steps.build_release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: godviewer-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # Publishes the release APK on the Releases page, in the same shape as
      # upstream (Chinese notes, release asset only — the debug APK stays an
      # Actions artifact). Needs "Read and write permissions" under
      # Settings → Actions → General → Workflow permissions.
      - name: Publish GitHub Release
        if: steps.build_release.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 'RELEASE_VERSION_NAME' app/build.gradle \
            | sed -E 's/.*"(.*)".*/\1/')
          CODE=$(grep -m1 'RELEASE_VERSION_CODE' app/build.gradle \
            | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          TAG="v$VERSION"
          echo "tag=$TAG versionCode=$CODE" | tee -a "$GITHUB_STEP_SUMMARY"

          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
            "dist/GodViewer-$VERSION-release.apk"

          {
            echo "## GodViewer v$VERSION"
            echo
            echo "### 新功能"
            echo "- 新增**「不显示通知」入口模式**：规则定好后可隐藏编辑模式入口通知（上帝视角本体通知与目标应用通知均可），已保存的规则仍会生效"
            echo "- 通知第一个按钮改为**「隐藏」**：点击立即隐藏入口通知并退出编辑模式，可在设置中重新开启"
            echo
            echo "### 优化"
            echo "- 点击通知即可**开关编辑模式**，不必再到属性弹窗里点「退出编辑模式」"
            echo "- 通知正文**实时显示**当前处于什么模式，以及点击后的效果"
            echo
            echo "### 说明"
            echo "- 本包由 CI 自动构建（R8 混淆 + 资源瘦身），签名非官方密钥，与官方安装包不能互相覆盖，需先卸载旧版"
            echo "- 安装后在 LSPosed 中勾选目标应用作用域，并强制停止一次目标应用"
            echo
            echo "**构建版本**：main 分支 \`${{ github.sha }}\`（versionCode $CODE）"
          } > dist/notes.md

          # Re-publishing the same version replaces the previous release, so a
          # push to main always refreshes the asset instead of failing on a
          # duplicate tag.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "GodViewer v$VERSION" \
            --notes-file dist/notes.md \
            dist/*.apk

          echo "release: https://github.com/${{ github.repository }}/releases/tag/$TAG" \
            >> "$GITHUB_STEP_SUMMARY"
